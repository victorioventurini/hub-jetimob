# Compliance Baseline CI Gate
#
# Runs all mandatory audits defined in COMPLIANCE_BASELINE.md
# Blocks merge if any blocking audit fails
#
# @see docs/engineering/COMPLIANCE_BASELINE.md
# @version 1.0.0

name: Compliance Baseline

on:
  pull_request:
    paths:
      # Database changes
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      # Documentation changes
      - 'docs/engineering/**'
      - 'docs/TECHNICAL_CONTEXT_REGISTRY.md'
      # Source code changes in critical areas
      - 'src/integrations/supabase/**'
      - 'src/contexts/**'
      - 'src/hooks/use*.ts'
      - 'src/hooks/use*.tsx'
      # Compliance configuration
      - 'scripts/audit-*.ts'
      - 'scripts/run-compliance-checks.ts'
      - '.github/workflows/compliance-all.yml'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      continue_on_error:
        description: 'Continue running all audits even if one fails'
        required: false
        default: 'false'
        type: boolean

jobs:
  compliance-check:
    name: Compliance Baseline Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Data Model Registry is up-to-date
        id: registry-check
        run: |
          echo "Checking if DATA_MODEL_REGISTRY.json is up-to-date..."
          
          # Backup current registry
          cp docs/canonical/DATA_MODEL_REGISTRY.json /tmp/registry-before.json 2>/dev/null || echo "{}" > /tmp/registry-before.json
          
          # Generate fresh registry (if generator exists)
          if [ -f "scripts/generate-data-model-registry.ts" ]; then
            npx tsx scripts/generate-data-model-registry.ts --dry-run || true
          fi
          
          echo "Registry check complete"
        continue-on-error: true

      - name: Run Compliance Checks
        id: compliance
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.continue_on_error }}" = "true" ]; then
            ARGS="--continue-on-error"
          fi
          
          npx tsx scripts/run-compliance-checks.ts $ARGS
        env:
          # Ensure scripts can find all files
          NODE_ENV: production

      - name: Upload Compliance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: |
            /tmp/compliance-*.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment on PR (if failed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const message = `## ❌ Compliance Baseline Check Failed
            
            This PR cannot be merged until all compliance checks pass.
            
            ### How to fix
            
            1. Run the compliance check locally:
               \`\`\`bash
               npx tsx scripts/run-compliance-checks.ts
               \`\`\`
            
            2. Fix any reported violations
            
            3. Push the fixes and the check will run again
            
            ### Documentation
            
            - [Compliance Baseline](docs/audits/COMPLIANCE_BASELINE.md)
            - [Development Standards](docs/canonical/DEVELOPMENT_STANDARDS.md)
            
            ---
            *This comment was generated automatically by the Compliance CI Gate.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  # Summary job for branch protection
  compliance-summary:
    name: Compliance Summary
    runs-on: ubuntu-latest
    needs: compliance-check
    if: always()
    
    steps:
      - name: Check compliance result
        run: |
          if [ "${{ needs.compliance-check.result }}" = "success" ]; then
            echo "✅ All compliance checks passed"
            exit 0
          else
            echo "❌ Compliance checks failed"
            exit 1
          fi
